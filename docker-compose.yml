x-inkstone-image: &inkstone-image ${INKSTONE_IMAGE:-inkstone-vps:local}

services:
  drawio:
    image: jgraph/drawio:32.6.1@sha256:3d0a5a5ffb4f76abcecd9d17ae1373e3eefd0db07b657c545637dc9c6a7412e1
    restart: unless-stopped
    environment:
      DRAWIO_BASE_URL: /drawio
      DRAWIO_CONFIG: '{"defaultLibraries":"general;flowchart;basic;arrows2", "plugins":[], "enableCustomLibraries":false}'
      JAVA_TOOL_OPTIONS: -Xmx384m
    mem_limit: 640m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/drawio/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true

  app:
    image: *inkstone-image
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      INKSTONE_PUBLIC_URL: ${INKSTONE_PUBLIC_URL:?Set INKSTONE_PUBLIC_URL in .env}
      INKSTONE_APP_NAME: ${INKSTONE_APP_NAME:-Inkstone}
      INKSTONE_LOG_LEVEL: ${INKSTONE_LOG_LEVEL:-info}
      INKSTONE_SCHEDULE_TOKEN: ${INKSTONE_SCHEDULE_TOKEN:?Generate INKSTONE_SCHEDULE_TOKEN in .env}
    expose:
      - "7712"
    volumes:
      - inkstone_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  scheduler:
    image: *inkstone-image
    pull_policy: never
    restart: unless-stopped
    init: true
    command: ["node", "scripts/vps-scheduler.mjs"]
    environment:
      INKSTONE_SCHEDULE_URL: http://app:7712/_internal/scheduled
      INKSTONE_SCHEDULE_TOKEN: ${INKSTONE_SCHEDULE_TOKEN:?Generate INKSTONE_SCHEDULE_TOKEN in .env}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  gateway:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      drawio:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INKSTONE_PORT:-7712}:8080"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /config
      - /data
    security_opt:
      - no-new-privileges:true

volumes:
  inkstone_data:
