name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run i18n:check
      - run: npm run comments:check
      - run: npm run build
      - name: Build release notes from conventional commits
        id: notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          RANGE="${PREVIOUS_TAG:+${PREVIOUS_TAG}..}${GITHUB_REF_NAME}"
          {
            echo "### Changes"
            echo ""
            git log --no-merges --pretty="- %s (%h)" ${RANGE} | grep -E "^- (feat|fix|perf|refactor)" || echo "- Maintenance release"
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
